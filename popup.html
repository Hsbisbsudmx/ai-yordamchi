<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e2e8f0;
      margin: 0;
    }
    h2 { 
      margin: 0 0 8px; 
      font-size: 16px;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 12px; color: #94a3b8; margin: 6px 0; line-height: 1.6; }
    .tip { 
      background: #1e1e2e; 
      border-radius: 8px; 
      padding: 10px; 
      margin-top: 10px;
      border: 1px solid rgba(99,102,241,0.2);
      font-size: 12px;
      color: #a5b4fc;
    }
    .tip b { color: #c4b5fd; }
  </style>
</head>
<body>
  <h2>🤖 AI Yordamchi</h2>
  <p>Har qanday saytning pastki o'ng burchagida <b>🤖</b> tugmani bosing.</p>
  <div class="tip">
    <b>📄 Sahifa tugmasi</b> — sahifadagi matnni o'qiydi<br><br>
    <b>⌨️ Enter</b> — xabar yuborish<br>
    <b>Shift+Enter</b> — yangi qator
  </div>
</body>
</html>
